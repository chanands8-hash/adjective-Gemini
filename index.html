<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>形容詞消消樂 3D Pro</title>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

        :root {
            --primary: #e11d48;
            --primary-light: #fb7185;
            --bg-menu: linear-gradient(160deg, #fef9ef 0%, #fdf2f8 30%, #eef7ff 70%, #f0fdf4 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #fdf2f8;
            color: #1e1b4b;
        }

        /* ===== 背景與裝飾 ===== */
        #bg {
            position: fixed; inset: 0; z-index: 0; transition: background 0.8s ease;
        }
        .bg-menu { background: var(--bg-menu); }
        .bg-lv1 { background: linear-gradient(160deg, #f0fdf4 0%, #dcfce7 100%); }
        .bg-lv2 { background: linear-gradient(160deg, #eff6ff 0%, #dbeafe 100%); }
        .bg-lv3 { background: linear-gradient(160deg, #fdf2f8 0%, #fce7f3 100%); }
        .bg-lv4 { background: linear-gradient(160deg, #fff7ed 0%, #ffedd5 100%); }
        .bg-lv5 { background: linear-gradient(160deg, #faf5ff 0%, #f3e8ff 100%); }

        /* ===== 主容器 ===== */
        .wrap {
            position: relative; z-index: 10; max-width: 500px; margin: 0 auto;
            padding: 15px; display: flex; flex-direction: column; height: 100vh;
        }

        .screen { display: none; animation: fadeIn 0.4s ease both; flex: 1; flex-direction: column; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== 小兔子吉祥物 ===== */
        .bunny-box {
            display: flex; justify-content: center; align-items: flex-end; gap: 10px;
            margin-bottom: 5px; min-height: 65px; flex-shrink: 0;
        }
        .bunny {
            width: 60px; height: 60px; background: linear-gradient(145deg, #fff, #fecdd3);
            border-radius: 50%; position: relative; box-shadow: 0 5px 15px rgba(225, 29, 72, 0.1);
            animation: hop 3s infinite ease-in-out;
        }
        @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .bunny::before, .bunny::after { 
            content: ''; position: absolute; top: -20px; width: 14px; height: 28px;
            background: #fecdd3; border-radius: 50%; border: 2px solid #fff;
        }
        .bunny::before { left: 8px; transform: rotate(-15deg); }
        .bunny::after { right: 8px; transform: rotate(15deg); }
        
        .eyes { position: absolute; top: 35%; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; }
        .eye { width: 7px; height: 7px; background: #312e81; border-radius: 50%; }
        .nose { position: absolute; top: 55%; left: 50%; transform: translateX(-50%); width: 5px; height: 3px; background: #fb7185; border-radius: 50%; }

        .speech {
            background: rgba(255,255,255,0.9); padding: 8px 12px; border-radius: 15px;
            font-size: 0.85rem; font-weight: bold; color: #be185d;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05); position: relative;
            max-width: 200px; line-height: 1.4; backdrop-filter: blur(5px);
        }
        .speech::after {
            content: ''; position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
            border: 8px solid transparent; border-right-color: rgba(255,255,255,0.9);
        }

        /* ===== 頂部資訊 ===== */
        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { font-size: 2rem; font-weight: 900; color: #be185d; letter-spacing: 2px; }
        
        .stats-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.7); backdrop-filter: blur(5px);
            padding: 6px 12px; border-radius: 12px; margin-bottom: 4px;
            font-weight: bold; font-size: 0.85rem; border: 1px solid white; flex-shrink: 0;
        }
        .stars { color: #fbbf24; display: flex; gap: 2px; }

        /* ===== 答題區域 (2D Overlay) ===== */
        .answer-zone {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            background: rgba(255,255,255,0.6); border-radius: 15px;
            padding: 6px; margin-bottom: 5px; min-height: 55px;
            border: 2px dashed rgba(190,24,93,0.3); flex-shrink: 0;
            backdrop-filter: blur(5px); z-index: 20; position: relative;
        }
        .slot {
            width: 45px; height: 45px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; font-weight: 900; transition: all 0.3s;
            background: rgba(255,255,255,0.4); border: 2px solid transparent;
        }
        .slot.filled { background: white; border-color: #fda4af; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transform: scale(1.05); }
        
        .result-box {
            min-width: 65px; height: 45px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; font-weight: 900; background: rgba(0,0,0,0.05);
            transition: all 0.3s;
        }
        .result-box.correct { background: var(--primary); color: white; transform: scale(1.1); box-shadow: 0 5px 15px rgba(225, 29, 72, 0.3); }
        .result-box.wrong { background: #fee2e2; color: #ef4444; }

        /* ===== 3D Canvas 容器 ===== */
        #canvas-container {
            flex: 1; width: 100%; position: relative;
            border-radius: 20px; overflow: hidden;
            margin-bottom: 10px;
        }
        #game-3d-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            outline: none; touch-action: none;
        }

        /* ===== 按鈕 ===== */
        .btns { display: flex; gap: 10px; justify-content: center; padding-bottom: 10px; flex-shrink: 0; z-index: 20; position: relative; }
        .btn {
            padding: 16px 30px; border-radius: 50px; border: none; font-size: 1.1rem;
            font-family: inherit; font-weight: bold; cursor: pointer;
            transition: all 0.2s; box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
        .btn:active { transform: translateY(2px); box-shadow: none; }
        .btn-main { background: var(--primary); color: white; }
        .btn-sub { background: white; color: var(--primary); border: 1px solid #fecdd3; }
        .btn-hint { background: #fbbf24; color: white; }

        /* ===== 選關頁面 ===== */
        .level-grid {
            display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 20px;
            overflow-y: auto; padding: 10px 5px 30px;
        }
        .level-btn {
            padding: 18px; border-radius: 24px;
            display: flex; justify-content: space-between; align-items: center;
            border: 5px solid rgba(255, 255, 255, 0.85); 
            border-bottom-width: 10px; /* 營造方塊厚度感 */
            transition: all 0.1s; cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.12), 0 12px 24px rgba(0,0,0,0.06);
            position: relative;
            user-select: none;
        }
        .level-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 rgba(0,0,0,0.12), 0 14px 28px rgba(0,0,0,0.08); }
        .level-btn:active { 
            transform: translateY(4px); /* 點擊時下沉 */
            border-bottom-width: 6px; 
            box-shadow: 0 2px 0 rgba(0,0,0,0.12), 0 4px 8px rgba(0,0,0,0.04); 
        }
        .level-btn .info h3 { font-size: 1.3rem; color: #1e1b4b; margin-bottom: 4px; font-weight: 900; }
        .level-btn .info p { font-size: 0.85rem; color: #475569; font-weight: bold; }
        .level-btn .badge { 
            background: rgba(255, 255, 255, 0.85); padding: 8px 14px; border-radius: 20px; 
            font-size: 0.85rem; font-weight: bold; color: #be185d;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 2px solid rgba(255,255,255,1);
        }

        /* ===== 彈窗 ===== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
            z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; border-radius: 30px; padding: 30px; width: 100%; max-width: 350px;
            text-align: center; animation: modalIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h2 { color: #be185d; font-size: 1.8rem; margin-bottom: 10px; }
        .modal p { color: #64748b; margin-bottom: 20px; }
        .medal { font-size: 4rem; margin-bottom: 15px; display: block; }

        /* 進度條 */
        .progress-container { width: 100%; height: 8px; background: rgba(0,0,0,0.05); border-radius: 10px; margin-bottom: 5px; overflow: hidden; flex-shrink: 0; z-index: 20; position: relative;}
        .progress-bar { height: 100%; background: var(--primary-light); width: 0%; transition: width 0.5s ease; }
    </style>
</head>
<body>

<div id="bg" class="bg-menu"></div>

<div class="wrap">
    <!-- 選關頁面 -->
    <div id="screen-menu" class="screen active">
        <!-- 公司 Logo 區域 -->
        <div id="logo-container" style="display: flex; justify-content: flex-start; margin-top: 5px; min-height: 45px;">
            <img src="New 開心學坊 (30 x 15 厘米) (30 x 10 厘米).jpg" 
                 alt="開心學坊 Logo" 
                 style="height: 45px; object-fit: contain;"
                 onerror="this.style.display='none'; if(document.getElementById('logo-fallback')) document.getElementById('logo-fallback').style.display='block';">
            <!-- 圖片載入失敗時的備用文字 Logo -->
            <div id="logo-fallback" style="display: none; font-weight: 900; color: #be185d; font-size: 1.2rem; border-left: 4px solid #be185d; padding-left: 10px;">
                開心學坊
            </div>
        </div>

        <div class="header" style="margin-top: 10px;">
            <div class="bunny-box">
                <div class="bunny"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="nose"></div></div>
                <div class="speech">歡迎來到 3D 廣東話語音版！<br>記得開聲喔！🔊</div>
            </div>
            <h1>形容詞消消樂 3D</h1>
            <p style="color: #f472b6; font-size: 0.9rem;">拼湊詞語，聽發音，消除方塊！</p>
        </div>

        <div class="level-grid" id="level-list">
            <!-- 由 JS 動態生成 -->
        </div>
    </div>

    <!-- 遊戲頁面 -->
    <div id="screen-game" class="screen">
        <div class="stats-bar">
            <span id="level-title">關卡 1</span>
            <div class="stars" id="game-stars">⭐⭐⭐</div>
            <span>錯誤: <span id="error-count">0</span></span>
        </div>

        <div class="bunny-box">
            <div class="bunny" style="width:45px; height:45px;"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="nose"></div></div>
            <div class="speech" id="game-msg">點擊方塊聽發音，找出兩個字拼成形容詞！</div>
        </div>

        <div class="answer-zone">
            <div class="slot" id="slot-1">?</div>
            <div style="font-size: 1.2rem; color: #be185d; font-weight: 900;">+</div>
            <div class="slot" id="slot-2">?</div>
            <div style="font-size: 1.2rem; color: #be185d; font-weight: 900;">=</div>
            <div class="result-box" id="result-box">??</div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- 3D 遊戲區域 -->
        <div id="canvas-container">
            <canvas id="game-3d-canvas"></canvas>
        </div>

        <div class="btns">
            <button class="btn btn-sub" onclick="exitGame()">返回</button>
            <button class="btn btn-hint" onclick="useHint()">提示</button>
        </div>
    </div>
</div>

<!-- 結算彈窗 -->
<div class="modal-overlay" id="win-modal">
    <div class="modal">
        <span class="medal" id="modal-icon">🏆</span>
        <h2 id="modal-title">太棒了！</h2>
        <p id="modal-body">你完成了這一關！</p>
        <div class="btns">
            <button class="btn btn-sub" onclick="closeModal()">返回菜單</button>
            <button class="btn btn-main" id="next-level-btn">下一關</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    // --- 遊戲數據 ---
    const ADJECTIVES = {
        1: { name: "基礎篇", words: ["開心", "快樂", "漂亮", "可愛", "好吃", "乾淨", "巨大", "細小"], theme: "bg-lv1", icon: "🌟", color: "linear-gradient(135deg, #dcfce7, #bbf7d0)" },
        2: { name: "心情與感官", words: ["溫暖", "涼快", "明亮", "黑暗", "高興", "害怕", "勇敢", "聰明"], theme: "bg-lv2", icon: "😊", color: "linear-gradient(135deg, #dbeafe, #bfdbfe)" },
        3: { name: "環境與特徵", words: ["美麗", "善良", "整齊", "骯髒", "甜蜜", "辛苦", "安靜", "熱鬧"], theme: "bg-lv3", icon: "🏡", color: "linear-gradient(135deg, #fce7f3, #fbcfe8)" },
        4: { name: "質地與性格", words: ["柔軟", "堅硬", "輕便", "笨重", "活潑", "文靜", "寬廣", "狹窄"], theme: "bg-lv4", icon: "🧸", color: "linear-gradient(135deg, #ffedd5, #fed7aa)" },
        5: { name: "狀態與感官", words: ["鮮豔", "灰暗", "鋒利", "圓滑", "迅速", "緩慢", "涼爽", "炎熱"], theme: "bg-lv5", icon: "🌈", color: "linear-gradient(135deg, #f3e8ff, #e9d5ff)" }
    };

    const TILE_COLORS = [0xffffff, 0xfff1f2, 0xeff6ff, 0xf0fdf4, 0xfffbeb];
    const TEXT_COLORS = ['#be185d', '#1d4ed8', '#15803d', '#b45309'];

    let currentUser = null;
    let userProgress = {};
    let currentLevel = 1;
    let selectedTiles = [];
    let matchedCount = 0;
    let errors = 0;
    let gameData = [];
    let isProcessing = false;
    let isGameRunning = false;

    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    let app, db, auth;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'adj-elim-3d-pro';

    try {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
    } catch (e) { console.log("Firebase config missing"); }

    async function initAuth() {
        if (!auth) { renderLevelList(); return; }
        await signInAnonymously(auth);
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await loadProgress();
                renderLevelList();
            }
        });
    }

    async function loadProgress() {
        if (!currentUser || !db) return;
        try {
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'progress', 'main');
            const snap = await getDoc(docRef);
            if (snap.exists()) { userProgress = snap.data(); }
        } catch (e) { console.error(e); }
    }

    async function saveProgress(level, errorCount) {
        if (!currentUser || !db) return;
        const currentBest = userProgress[`lv${level}`]?.bestErrors ?? 999;
        if (errorCount < currentBest) {
            userProgress[`lv${level}`] = { bestErrors: errorCount, completed: true };
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'progress', 'main');
                await setDoc(docRef, userProgress);
                renderLevelList();
            } catch (e) { console.error(e); }
        }
    }

    function speakCantonese(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-HK';
        msg.rate = 0.9;
        msg.pitch = 1.1;
        window.speechSynthesis.speak(msg);
    }

    const canvasContainer = document.getElementById('canvas-container');
    const canvas = document.getElementById('game-3d-canvas');
    let scene, camera, renderer, raycaster, pointer, plane;
    let tiles = [];
    let particles = [];
    let mouseX = 0, mouseY = 0;
    let currentGridConfig = null;

    function init3D() {
        if (scene) return;
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0xffffff, 0.015);
        const aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
        camera = new THREE.PerspectiveCamera(50, aspect, 0.1, 1000);
        camera.position.set(0, 0, 8);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(0, 5, 8);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const planeGeo = new THREE.PlaneGeometry(30, 30);
        const planeMat = new THREE.ShadowMaterial({ opacity: 0.15 });
        plane = new THREE.Mesh(planeGeo, planeMat);
        plane.position.z = -1;
        plane.receiveShadow = true;
        scene.add(plane);

        raycaster = new THREE.Raycaster();
        pointer = new THREE.Vector2();

        canvas.addEventListener('pointerdown', onPointerDown);
        canvasContainer.addEventListener('pointermove', (e) => {
            const rect = canvasContainer.getBoundingClientRect();
            mouseX = (e.clientX - rect.left) / rect.width * 2 - 1;
            mouseY = -(e.clientY - rect.top) / rect.height * 2 + 1;
        });
        window.addEventListener('resize', onWindowResize);
    }

    function updateCameraFit() {
        if (!camera || !canvasContainer || !currentGridConfig) return;
        const width = canvasContainer.clientWidth;
        const height = canvasContainer.clientHeight;
        if (width === 0 || height === 0) return;
        camera.aspect = width / height;
        const { boardWidth, boardHeight } = currentGridConfig;
        const padding = 1.05;
        const fovRad = (camera.fov * Math.PI) / 180;
        const cameraZ_H = (boardHeight / 2) / Math.tan(fovRad / 2) * padding;
        const cameraZ_W = (boardWidth / 2) / (Math.tan(fovRad / 2) * camera.aspect) * padding;
        camera.position.z = Math.max(cameraZ_H, cameraZ_W, 8);
        if (plane) plane.scale.set(camera.position.z * 2, camera.position.z * 2, 1);
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
    }

    function onWindowResize() { updateCameraFit(); }

    function createTileMaterial(char, colorIdx) {
        const cWidth = 512, cHeight = 512;
        const txtCanvas = document.createElement('canvas');
        txtCanvas.width = cWidth; txtCanvas.height = cHeight;
        const ctx = txtCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cWidth, cHeight);
        ctx.strokeStyle = TEXT_COLORS[colorIdx]; ctx.lineWidth = 25; ctx.strokeRect(15, 15, cWidth-30, cHeight-30);
        ctx.fillStyle = TEXT_COLORS[colorIdx]; ctx.font = 'bold 320px "Noto Sans TC", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(char, cWidth / 2, cHeight / 2 + 25);
        const texture = new THREE.CanvasTexture(txtCanvas);
        const sideColor = TILE_COLORS[colorIdx + 1] || 0xffffff;
        return [
            new THREE.MeshStandardMaterial({ color: sideColor }),
            new THREE.MeshStandardMaterial({ color: sideColor }),
            new THREE.MeshStandardMaterial({ color: sideColor }),
            new THREE.MeshStandardMaterial({ color: sideColor }),
            new THREE.MeshStandardMaterial({ map: texture }),
            new THREE.MeshStandardMaterial({ color: sideColor }),
        ];
    }

    function build3DBoard() {
        if (!scene) return;
        tiles.forEach(t => scene.remove(t));
        tiles = [];
        const cols = 4;
        const rows = Math.ceil(gameData.length / cols);
        const size = 2.4, gap = 0.25;
        currentGridConfig = { cols, rows, size, gap, boardWidth: cols * size + (cols - 1) * gap, boardHeight: rows * size + (rows - 1) * gap };
        const startY = ((rows - 1) * (size + gap)) / 2;
        const geometry = new THREE.BoxGeometry(size, size, 0.4);
        gameData.forEach((item, index) => {
            const row = Math.floor(index / cols);
            const col = index % cols;
            const itemsInThisRow = (row === rows - 1) ? (gameData.length % cols || cols) : cols;
            const startX = -((itemsInThisRow - 1) * (size + gap)) / 2;
            const x = startX + col * (size + gap), y = startY - row * (size + gap), z = 0;
            const mesh = new THREE.Mesh(geometry, createTileMaterial(item.char, item.colorIdx));
            mesh.position.set(x, y + 10, z);
            mesh.castShadow = true;
            mesh.userData = { id: index, char: item.char, pairId: item.pairId, charIdx: item.charIdx, targetPos: new THREE.Vector3(x, y, z), baseX: x, baseZ: z, state: 'idle', shakeTimer: 0 };
            scene.add(mesh);
            tiles.push(mesh);
        });
    }

    function onPointerDown(event) {
        if (!isGameRunning || isProcessing) return;
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const intersects = raycaster.intersectObjects(tiles);
        if (intersects.length > 0) handleTileClick(intersects[0].object);
    }

    function handleTileClick(tile) {
        if (tile.userData.state === 'matched') return;
        speakCantonese(tile.userData.char);
        if (tile.userData.state === 'selected') {
            tile.userData.state = 'idle'; tile.userData.targetPos.z = tile.userData.baseZ;
            selectedTiles = selectedTiles.filter(t => t !== tile);
            updateSlotsUI(); return;
        }
        if (selectedTiles.length < 2) {
            tile.userData.state = 'selected'; tile.userData.targetPos.z = tile.userData.baseZ + 0.9;
            selectedTiles.push(tile); updateSlotsUI();
            if (selectedTiles.length === 2) setTimeout(checkMatch, 400);
        }
    }

    function createExplosion(pos) {
        const particleGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
        const particleMat = new THREE.MeshBasicMaterial({ color: 0xe11d48 });
        for (let i = 0; i < 15; i++) {
            const mesh = new THREE.Mesh(particleGeo, particleMat);
            mesh.position.copy(pos);
            mesh.userData = { velocity: new THREE.Vector3((Math.random()-0.5)*0.2, Math.random()*0.2+0.1, (Math.random()-0.5)*0.2), life: 1.0 };
            scene.add(mesh); particles.push(mesh);
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        if (!isGameRunning) return;
        if (camera) {
            camera.position.x += (mouseX * 0.5 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 0.5 - camera.position.y) * 0.05;
            camera.lookAt(0, 0, 0);
        }
        tiles.forEach(tile => {
            if (tile.userData.state === 'error') {
                tile.userData.shakeTimer += 0.4;
                tile.position.x = tile.userData.baseX + Math.sin(tile.userData.shakeTimer) * 0.15;
                if (tile.userData.shakeTimer > Math.PI * 4) {
                    tile.userData.state = 'idle'; tile.userData.targetPos.z = tile.userData.baseZ; tile.position.x = tile.userData.baseX;
                }
            } else if (tile.userData.state === 'matched') {
                tile.position.lerp(tile.userData.targetPos, 0.15); tile.scale.lerp(new THREE.Vector3(0,0,0), 0.1);
            } else { tile.position.lerp(tile.userData.targetPos, 0.15); }
        });
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.position.add(p.userData.velocity); p.userData.velocity.y -= 0.01; p.scale.multiplyScalar(0.92); p.userData.life -= 0.02;
            if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
        }
        if (renderer && scene && camera) renderer.render(scene, camera);
    }

    function renderLevelList() {
        const list = document.getElementById('level-list');
        if (!list) return;
        list.innerHTML = '';
        Object.keys(ADJECTIVES).forEach(lv => {
            const data = ADJECTIVES[lv], prog = userProgress[`lv${lv}`];
            const btn = document.createElement('div');
            btn.className = 'level-btn'; btn.style.background = data.color; btn.onclick = () => startLevel(parseInt(lv));
            btn.innerHTML = `
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div style="font-size: 2.2rem; background: rgba(255,255,255,0.6); width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; border-radius: 15px; box-shadow: inset 0 2px 5px rgba(255,255,255,0.5);">${data.icon}</div>
                    <div class="info"><h3>關卡 ${lv}: ${data.name}</h3><p>${data.words.length} 個形容詞</p></div>
                </div>
                <div>${prog ? `<span class="badge">最佳錯誤: ${prog.bestErrors}</span>` : '<span class="badge" style="background: rgba(255,255,255,0.5); color: #64748b;">未挑戰</span>'}</div>`;
            list.appendChild(btn);
        });
    }

    window.startLevel = function(lv) {
        currentLevel = lv; 
        errors = 0; 
        matchedCount = 0; 
        selectedTiles = [];
        isProcessing = false; // 強制重置處理標記

        const data = ADJECTIVES[lv];
        gameData = [];
        data.words.forEach((word, idx) => {
            const cIdx = idx % 4;
            gameData.push({ char: word[0], pairId: idx, charIdx: 0, colorIdx: cIdx });
            gameData.push({ char: word[1], pairId: idx, charIdx: 1, colorIdx: cIdx });
        });
        gameData.sort(() => Math.random() - 0.5);

        document.getElementById('bg').className = `bg ${data.theme}`;
        document.getElementById('level-title').textContent = `關卡 ${lv}: ${data.name}`;
        document.getElementById('error-count').textContent = '0';
        document.getElementById('progress-bar').style.width = '0%';
        updateStars(); updateSlotsUI();
        
        showScreen('screen-game');

        setTimeout(() => {
            isGameRunning = true;
            if (!scene) { init3D(); animate(); }
            build3DBoard(); 
            updateCameraFit();
        }, 50);
    }

    function updateSlotsUI() {
        const s1 = document.getElementById('slot-1'), s2 = document.getElementById('slot-2'), res = document.getElementById('result-box');
        if(!s1 || !s2 || !res) return;
        s1.textContent = selectedTiles[0] ? selectedTiles[0].userData.char : '?';
        s1.className = selectedTiles[0] ? 'slot filled' : 'slot';
        s2.textContent = selectedTiles[1] ? selectedTiles[1].userData.char : '?';
        s2.className = selectedTiles[1] ? 'slot filled' : 'slot';
        if (selectedTiles.length === 2) { res.textContent = selectedTiles[0].userData.char + selectedTiles[1].userData.char; }
        else { res.textContent = '??'; res.className = 'result-box'; }
    }

    window.checkMatch = async function() {
        if (selectedTiles.length !== 2 || isProcessing) return;
        isProcessing = true;
        const t1 = selectedTiles[0], t2 = selectedTiles[1], resBox = document.getElementById('result-box');
        const word = t1.userData.char + t2.userData.char;
        const isSamePair = t1.userData.pairId === t2.userData.pairId, isCorrectOrder = t1.userData.charIdx === 0 && t2.userData.charIdx === 1;
        
        if (isSamePair && isCorrectOrder) {
            matchedCount++; 
            resBox.className = 'result-box correct';
            document.getElementById('game-msg').textContent = `太棒了！「${word}」配對成功！`;
            speakCantonese(word);
            
            t1.userData.state = 'matched'; t2.userData.state = 'matched';
            const flyZ = camera.position.z - 4;
            t1.userData.targetPos = new THREE.Vector3(0, 0, flyZ); t2.userData.targetPos = new THREE.Vector3(0, 0, flyZ);
            
            setTimeout(() => { 
                createExplosion(t1.position); 
                if(scene) { scene.remove(t1); scene.remove(t2); }
            }, 300);
            
            updateProgressBar();
            
            setTimeout(() => { 
                selectedTiles = []; 
                updateSlotsUI(); 
                resBox.className = 'result-box'; 
                isProcessing = false; 
                if (matchedCount === ADJECTIVES[currentLevel].words.length) gameWin(); 
            }, 800);
        } else {
            errors++; 
            document.getElementById('error-count').textContent = errors;
            resBox.className = 'result-box wrong';
            document.getElementById('game-msg').textContent = (isSamePair && !isCorrectOrder) ? `哎呀，「${word}」次序調轉咗唔啱喔。` : `哎呀，「${word}」拼不起來喔。`;
            updateStars(); 
            t1.userData.state = 'error'; t2.userData.state = 'error'; t1.userData.shakeTimer = 0; t2.userData.shakeTimer = 0;
            setTimeout(() => { 
                selectedTiles = []; 
                updateSlotsUI(); 
                resBox.className = 'result-box'; 
                isProcessing = false; 
            }, 800);
        }
    }

    function updateProgressBar() { const p = (matchedCount / ADJECTIVES[currentLevel].words.length) * 100; document.getElementById('progress-bar').style.width = p + '%'; }
    function updateStars() { const s = document.getElementById('game-stars'); if (errors === 0) s.textContent = '⭐⭐⭐'; else if (errors <= 3) s.textContent = '⭐⭐☆'; else s.textContent = '⭐☆☆'; }
    
    window.useHint = function() {
        if (isProcessing) return;
        let targetId = -1;
        for (let i = 0; i < tiles.length; i++) { if (tiles[i].userData.state !== 'matched' && tiles[i].parent) { targetId = tiles[i].userData.pairId; break; } }
        if (targetId !== -1) {
            const w = ADJECTIVES[currentLevel].words[targetId];
            document.getElementById('game-msg').textContent = `提示：試試找「${w}」。`; 
            speakCantonese(`試試找：${w}`);
            tiles.forEach(t => { if(t.userData.pairId === targetId && t.userData.state === 'idle') t.position.z += 0.5; });
        }
    }

    async function gameWin() {
        isGameRunning = false; // 停止背景渲染邏輯
        speakCantonese("好叻呀！你完成咗呢關！");
        await saveProgress(currentLevel, errors);
        
        const modal = document.getElementById('win-modal');
        const title = document.getElementById('modal-title');
        const icon = document.getElementById('modal-icon');
        const nextBtn = document.getElementById('next-level-btn');

        if (errors === 0) {
            title.textContent = '完美通關！';
            icon.textContent = '👑';
        } else {
            title.textContent = '挑戰成功！';
            icon.textContent = '🏆';
        }

        if (currentLevel < Object.keys(ADJECTIVES).length) {
            nextBtn.style.display = 'block';
            nextBtn.onclick = () => {
                modal.classList.remove('active');
                startLevel(currentLevel + 1); // 此處會重新將 isGameRunning 設為 true
            };
        } else {
            nextBtn.style.display = 'none';
        }

        modal.classList.add('active');
    }

    window.closeModal = function() { document.getElementById('win-modal').classList.remove('active'); exitGame(); }
    
    window.exitGame = function() { 
        isGameRunning = false; 
        showScreen('screen-menu'); 
        document.getElementById('bg').className = 'bg-menu'; 
        if (scene) tiles.forEach(t => scene.remove(t)); 
    }
    
    function showScreen(id) { 
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); 
        const target = document.getElementById(id);
        if(target) target.classList.add('active'); 
    }
    
    window.onload = () => { 
        initAuth(); 
        if(window.speechSynthesis) window.speechSynthesis.getVoices(); 
    };
</script>
</body>
